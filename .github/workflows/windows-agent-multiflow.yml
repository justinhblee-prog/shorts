name: Windows self-hosted Agent multi-flow

on:
  push:
    branches:
      - fix/devflow-detached-supervisor-2026-11-20
    paths:
      - .devflow/tasks.json
      - .github/workflows/windows-agent-multiflow.yml
      - scripts/git-cli-multiflow-parallel.ps1
      - scripts/ollama-agent.py
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum tasks to process in this run (1-3)
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      agent_smoke_test:
        description: Run one isolated real Agent CLI request instead of project tasks
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: windows-agent-multiflow
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.ref == 'refs/heads/fix/devflow-detached-supervisor-2026-11-20'
    runs-on: [self-hosted, Windows, X64, shorts-agent]
    timeout-minutes: 360
    steps:
      - name: Checkout approved automation branch
        uses: actions/checkout@v4
        with:
          ref: fix/devflow-detached-supervisor-2026-11-20
          clean: true

      - name: Verify Windows execution environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required." }
          foreach ($tool in @("git", "gh", "python", "pwsh")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing required tool: $tool" }
          }
          gh auth status
          $ollama = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          if (-not ($ollama.models | Where-Object { $_.name -eq "qwen2.5-coder:7b" })) { throw "Required local Ollama model qwen2.5-coder:7b is not available." }
          & "$PWD/scripts/git-cli-agent-config.ps1" -Check
          if ($LASTEXITCODE -ne 0) { throw "Agent CLI preflight failed." }
          Write-Host "PASS: self-hosted Windows runner, GitHub auth, clean checkout and Agent CLI configuration."

      - name: Verify detached supervisor polling and failure recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$PWD/scripts/test-devflow-detached-supervisor.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Detached supervisor regression failed with exit code $LASTEXITCODE." }

      - name: Run isolated real Agent CLI smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.agent_smoke_test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & "$PWD/scripts/test-real-agent-cli.ps1" -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) { throw "Real Agent CLI smoke test failed with exit code $LASTEXITCODE." }

      - name: Verify real local Ollama tool-call protocol
        if: github.event_name != 'workflow_dispatch' || inputs.agent_smoke_test != true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & python "$PWD/scripts/test_ollama_tool_protocol.py" --model "qwen2.5-coder:7b"
          if ($LASTEXITCODE -ne 0) { throw "Local Ollama tool-call protocol verification failed with exit code $LASTEXITCODE." }

      - name: Run real multi-flow workers
        if: github.event_name != 'workflow_dispatch' || inputs.agent_smoke_test != true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rawCount = "${{ inputs.max_tasks }}"
          if ([string]::IsNullOrWhiteSpace($rawCount)) { $rawCount = "3" }
          $count = [int]$rawCount
          if ($count -lt 1 -or $count -gt 3) { throw "max_tasks must be between 1 and 3." }
          # Worker processes execute from isolated task worktrees. Anchor the shared
          # Ollama agent script to this runner checkout so relative paths do not break.
          $python = (Get-Command python -ErrorAction Stop).Source
          $agentScript = Join-Path $PWD "scripts/ollama-agent.py"
          if (-not (Test-Path -LiteralPath $agentScript)) { throw "Local Ollama agent script is missing: $agentScript" }
          $env:DEVFLOW_AGENT_COMMAND = $python
          $env:DEVFLOW_AGENT_ARGS_JSON = ConvertTo-Json -Compress -InputObject @($agentScript, "--prompt-file", "{prompt_file}", "--model", "qwen2.5-coder:7b")
          Write-Host "Using runner-checkout Agent script with isolated worker prompt files."
          & "$PWD/scripts/start-devflow-autopilot.ps1" -Run -MaxTasks $count
          if ($LASTEXITCODE -ne 0) { throw "Real Agent multi-flow run failed with exit code $LASTEXITCODE." }

      - name: Collect execution evidence
        if: always()
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $evidence = Join-Path $workspace "multiflow-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $parent = Split-Path $workspace -Parent
          foreach ($name in @("shorts-multiflow-state", "shorts-multiflow-logs")) {
            $source = Join-Path $parent $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $evidence $name) -Recurse -Force
            }
          }

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-multiflow-${{ github.run_id }}
          path: multiflow-evidence/**
          if-no-files-found: warn
          retention-days: 14
