name: Ollama Agent multi-flow

on:
  push:
    branches:
      - fix/devflow-detached-supervisor-2026-11-20
      - fix/devflow-supervisor-poll-loop-2026-11-21
    paths:
      - .devflow/tasks.json
      - .github/workflows/windows-agent-multiflow.yml
      - scripts/git-cli-multiflow-parallel.ps1
      - scripts/ollama-agent.py
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum tasks to process in this run (1-3)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ollama-agent-multiflow
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.ref == 'refs/heads/fix/devflow-supervisor-poll-loop-2026-11-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout automation supervisor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: true

      - name: Pin Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache local Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-coder-7b-v1

      - name: Install and start isolated Ollama runtime
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat "$RUNNER_TEMP/ollama.log"
              exit 1
            fi
            sleep 2
          done
          ollama pull qwen2.5-coder:7b

      - name: Verify hosted execution environment and agent contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($tool in @("git", "gh", "python", "pwsh")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing required tool: $tool" }
          }
          gh auth status
          $ollama = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          if (-not ($ollama.models | Where-Object { $_.name -eq "qwen2.5-coder:7b" })) { throw "Required Ollama model qwen2.5-coder:7b is not available." }
          $env:DEVFLOW_AGENT_COMMAND = (Get-Command python -ErrorAction Stop).Source
          $env:DEVFLOW_AGENT_ARGS_JSON = ConvertTo-Json -Compress -InputObject @((Join-Path $PWD "scripts/ollama-agent.py"), "--prompt-file", "{prompt_file}", "--model", "qwen2.5-coder:7b")
          & "$PWD/scripts/git-cli-agent-config.ps1" -Check
          if ($LASTEXITCODE -ne 0) { throw "Agent CLI preflight failed." }
          Write-Host "PASS: GitHub auth, PowerShell, Python, isolated Ollama model and task manifest."

      - name: Verify detached supervisor polling and failure recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$PWD/scripts/test-devflow-detached-supervisor.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Detached supervisor regression failed with exit code $LASTEXITCODE." }

      - name: Verify real local Ollama tool-call protocol
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & python "$PWD/scripts/test_ollama_tool_protocol.py" --model "qwen2.5-coder:7b"
          if ($LASTEXITCODE -ne 0) { throw "Ollama tool-call protocol verification failed with exit code $LASTEXITCODE." }

      - name: Run real multi-flow workers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rawCount = "${{ inputs.max_tasks }}"
          if ([string]::IsNullOrWhiteSpace($rawCount)) { $rawCount = "1" }
          $count = [int]$rawCount
          if ($count -lt 1 -or $count -gt 3) { throw "max_tasks must be between 1 and 3." }
          $python = (Get-Command python -ErrorAction Stop).Source
          $agentScript = Join-Path $PWD "scripts/ollama-agent.py"
          if (-not (Test-Path -LiteralPath $agentScript)) { throw "Ollama agent script is missing: $agentScript" }
          $env:DEVFLOW_AGENT_COMMAND = $python
          $env:DEVFLOW_AGENT_ARGS_JSON = ConvertTo-Json -Compress -InputObject @($agentScript, "--prompt-file", "{prompt_file}", "--model", "qwen2.5-coder:7b")
          # Keep a real 5-minute supervisor loop alive after this push. The
          # bounded 12-cycle run gives the queue one hour of autonomous retries
          # and discovery without requiring the user's Windows PC to stay online.
          & "$PWD/scripts/start-devflow-detached.ps1" -Supervisor -MaxTasks $count -PollIntervalSeconds 300 -MaxCycles 12
          if ($LASTEXITCODE -ne 0) { throw "Ollama supervisor loop failed with exit code $LASTEXITCODE." }

      - name: Collect execution evidence
        if: always()
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $evidence = Join-Path $workspace "multiflow-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $parent = Split-Path $workspace -Parent
          foreach ($name in @("shorts-multiflow-state", "shorts-multiflow-logs")) {
            $source = Join-Path $parent $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $evidence $name) -Recurse -Force
            }
          }

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-agent-multiflow-${{ github.run_id }}
          path: multiflow-evidence/**
          if-no-files-found: warn
          retention-days: 14
