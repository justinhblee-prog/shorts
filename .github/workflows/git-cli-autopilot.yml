name: Git CLI autopilot validation

on:
  pull_request:
    paths:
      - "scripts/git-cli-autopilot.ps1"
      - "scripts/git-cli-multiflow.ps1"
      - "scripts/git-cli-multiflow-parallel.ps1"
      - "scripts/test-git-cli-multiflow-parallel.ps1"
      - "scripts/test-devflow-detached.ps1"
      - "scripts/test-devflow-detached-e2e.ps1"
      - "scripts/git-cli-agent-config.ps1"
      - "scripts/start-devflow-autopilot.ps1"
      - "scripts/start-devflow-detached.ps1"
      - "scripts/devflow-agent-process.ps1"
      - "scripts/ollama-agent.py"
      - "scripts/test_ollama_agent.py"
      - "scripts/devflow.py"
      - ".github/workflows/git-cli-autopilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: git-cli-autopilot-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  powershell:
    name: PowerShell syntax and safe-mode checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/git-cli-autopilot.ps1",
            "scripts/git-cli-multiflow.ps1",
            "scripts/git-cli-multiflow-parallel.ps1",
            "scripts/test-git-cli-multiflow-parallel.ps1",
            "scripts/test-devflow-detached.ps1",
            "scripts/test-devflow-detached-e2e.ps1",
            "scripts/git-cli-agent-config.ps1",
            "scripts/start-devflow-autopilot.ps1",
            "scripts/start-devflow-detached.ps1",
            "scripts/devflow-agent-process.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "Parsed: $file"
          }
          $env:GH_TOKEN = "${{ github.token }}"
          $plan = & "$PWD/scripts/git-cli-multiflow.ps1" -Plan 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Multi-flow planner smoke failed: $plan" }
          if ($plan -match "BUILD-00352") {
            throw "Planner included BUILD-00352 even though its task already has an open PR."
          }
          Write-Host "Planner correctly excludes tasks represented by open PRs."
          Write-Host $plan
      - name: Validate Agent CLI configuration contract
        shell: pwsh
        run: |
          & "$PWD/scripts/git-cli-agent-config.ps1" -ValidateOnly -AgentCommand "fixture-agent" -AgentArgsJson '["--prompt-file","{prompt_file}"]'
          if (-not $?) { throw "Valid Agent CLI configuration was rejected." }
          & "$PWD/scripts/git-cli-agent-config.ps1" -ValidateOnly -AgentCommand "claude" -AgentArgsJson '["-p","{prompt_text}","--permission-mode","acceptEdits"]'
          if (-not $?) { throw "Valid Claude prompt-text configuration was rejected." }
          $failed = $false
          try { & "$PWD/scripts/git-cli-agent-config.ps1" -ValidateOnly -AgentCommand "claude" -AgentArgsJson '["-p","{prompt_file}","{prompt_text}"]' } catch { $failed = $true }
          if (-not $failed) { throw "Mixed prompt placeholders were not rejected." }
          $failed = $false
          try { & "$PWD/scripts/git-cli-agent-config.ps1" -ValidateOnly -AgentCommand "fixture-agent" -AgentArgsJson '["--token","fake-secret","{prompt_file}"]' } catch { $failed = $true }
          if (-not $failed) { throw "Credential-like Agent CLI arguments were not rejected." }
      - name: Exercise three isolated workers concurrently
        shell: pwsh
        run: |
          & "$PWD/scripts/test-git-cli-multiflow-parallel.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Parallel worker integration harness failed." }
      - name: Launcher plan ignores configured agent JSON
        shell: pwsh
        run: |
          $env:DEVFLOW_AGENT_ARGS_JSON = '["--prompt-file","{prompt_file}"]'
          $env:DEVFLOW_AGENT_COMMAND = 'agent-that-is-not-installed'
          & "$PWD/scripts/start-devflow-autopilot.ps1" -Plan -MaxTasks 3
          if (-not $?) { throw "Launcher plan smoke failed with agent env configured." }
      - name: Exercise detached Windows supervisor lifecycle
        shell: pwsh
        run: |
          & "$PWD/scripts/test-devflow-detached.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Detached supervisor integration harness failed." }
      - name: Exercise detached supervisor end-to-end worker lifecycle
        shell: pwsh
        run: |
          & "$PWD/scripts/test-devflow-detached-e2e.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Detached supervisor end-to-end test failed." }
      - name: Verify detached supervisor safety contract
        shell: pwsh
        run: |
          $script = Get-Content "scripts/start-devflow-detached.ps1" -Raw
          foreach ($required in @("Start-Process", "WindowStyle Hidden", "scheduler.lock", "FileShare]::None", "stdout_log", "stderr_log", "status_file")) {
            if ($script -notmatch [regex]::Escape($required)) { throw "Detached supervisor contract missing: $required" }
          }
          if ($script -match "(?i)codex|bypass-permissions|dangerously-skip-permissions") {
            throw "Detached supervisor must not add Codex or permission-bypass behavior."
          }
      - name: Confirm Codex is not referenced by launcher
        shell: pwsh
        run: |
          $launcher = Get-Content "scripts/start-devflow-autopilot.ps1" -Raw
          if ($launcher -match "(?i)codex") { throw "Launcher must not depend on Codex." }
      - name: Confirm no implicit merge or deployment commands
        shell: pwsh
        run: |
          foreach ($path in @("scripts/git-cli-autopilot.ps1", "scripts/git-cli-multiflow.ps1", "scripts/git-cli-multiflow-parallel.ps1")) {
            $script = Get-Content $path -Raw
            if ($script -match "(?im)^\\s*gh\\s+pr\\s+merge") { throw "Automatic merge is forbidden: $path" }
            if ($script -match "(?im)^\\s*vercel\\s+deploy") { throw "Automatic deployment is forbidden: $path" }
          }
          $engine = Get-Content "scripts/git-cli-multiflow-parallel.ps1" -Raw
          if ($engine -notmatch 'FileShare\]::None') { throw "Parallel workers must use exclusive task leases." }
          if ($engine -notmatch 'Kill\(\$true\)') { throw "Timeout handling must terminate the worker process tree." }
          if ($engine -notmatch 'MaxParallel') { throw "Parallel worker cap is missing." }

  python:
    name: Git workflow helper validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile helpers and local Ollama Agent
        run: python -m py_compile scripts/devflow.py scripts/ollama-agent.py scripts/test_ollama_agent.py
      - name: Run isolated local Ollama Agent safety tests
        run: python -m unittest scripts.test_ollama_agent -v
      - name: Validate task manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".devflow/tasks.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("tasks"), list)
          assert data.get("policy", {}).get("max_parallel_worktrees", 0) == 3
          assert data["policy"].get("auto_merge") is False
          assert data["policy"].get("auto_deploy") is False
          print(f"Validated {len(data['tasks'])} task entries and safety policy.")
          PY
