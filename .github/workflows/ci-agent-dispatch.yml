name: CI completion agent dispatch

# Runs only after the existing validation workflow finishes successfully.
# This workflow is intentionally a dispatcher: the external coding agent must
# perform the actual repository work and report its result through its own logs/PR.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-agent-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'build/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check agent endpoint configuration
        id: config
        env:
          AGENT_WEBHOOK_URL: ${{ secrets.NEXUS_AGENT_WEBHOOK_URL }}
          AGENT_WEBHOOK_TOKEN: ${{ secrets.NEXUS_AGENT_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$AGENT_WEBHOOK_URL" ] || [ -z "$AGENT_WEBHOOK_TOKEN" ]; then
            echo "::warning::NEXUS_AGENT_WEBHOOK_URL and/or NEXUS_AGENT_WEBHOOK_TOKEN are not configured. CI passed, but no coding agent was dispatched."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AGENT_WEBHOOK_URL" in
            https://*) ;;
            *) echo "::error::Agent webhook URL must use HTTPS."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch successful BUILD validation to coding agent
        if: steps.config.outputs.configured == 'true'
        env:
          AGENT_WEBHOOK_URL: ${{ secrets.NEXUS_AGENT_WEBHOOK_URL }}
          AGENT_WEBHOOK_TOKEN: ${{ secrets.NEXUS_AGENT_WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          payload="$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            --arg run_url "$WORKFLOW_RUN_URL" \
            --arg branch "$HEAD_BRANCH" \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            '{
              event: "build.validation.completed",
              repository: $repository,
              workflow_run_id: $run_id,
              workflow_run_url: $run_url,
              head_branch: $branch,
              head_sha: $sha,
              conclusion: $conclusion,
              instructions: {
                inspect_existing_draft_pr: true,
                continue_next_build_only_after_success: true,
                preserve_stacked_pr_base: true,
                create_draft_pr_only: true,
                never_merge: true,
                require_regression_tests: true,
                distinguish_ci_from_live_provider_validation: true
              }
            }')"
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -X POST "$AGENT_WEBHOOK_URL" \
            -H "Authorization: Bearer $AGENT_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Nexus-Event: build.validation.completed" \
            --data "$payload"
