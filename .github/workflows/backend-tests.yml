name: Backend tests
on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/nexus-development-job-worker.yml"
      - ".github/workflows/nexus-continuous-codex.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - run: node --check frontend/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/ui_browser_smoke.mjs
      - run: node scripts/ui_recovery_browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-integrated-dashboard-browser-artifacts
          path: artifacts/*.png
          if-no-files-found: ignore
