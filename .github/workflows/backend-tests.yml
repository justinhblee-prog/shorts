name: Backend tests
on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/nexus-development-job-worker.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/nexus-development-job-worker.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - run: python -c "import yaml; yaml.safe_load(open('.github/workflows/nexus-development-job-worker.yml', encoding='utf-8'))"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/ui_development_monitor_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-monitor-browser-smoke
          path: artifacts/development-monitor-*.png
          if-no-files-found: ignore
