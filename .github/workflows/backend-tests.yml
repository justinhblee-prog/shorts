name: Backend tests
on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/nexus-development-job-worker.yml"
      - ".github/workflows/nexus-continuous-codex.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - run: node --check frontend/app.js
