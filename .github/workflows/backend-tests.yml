name: Backend tests
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - name: Install CJK fallback fonts for readable browser artifacts
        run: |
          if fc-list :lang=ko 2>/dev/null | grep -qiE 'Noto Sans CJK|Noto Sans KR|Noto Serif CJK'; then
            echo "Korean-capable Noto font is already installed."
            exit 0
          fi
          sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes -qq -o Acquire::Retries=2 fonts-noto-cjk
          fc-cache --force
          fc-list :lang=ko | grep -qiE 'Noto Sans CJK|Noto Sans KR|Noto Serif CJK'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/ui_browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-dashboard-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
