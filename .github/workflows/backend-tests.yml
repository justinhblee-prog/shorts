name: Backend tests
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - name: Verify Korean font fallback without package-manager dependency
        run: |
          if command -v fc-list >/dev/null 2>&1 && fc-list :lang=ko 2>/dev/null | grep -qiE 'Noto Sans CJK|Noto Sans KR|Noto Serif CJK|Nanum|UnDotum'; then
            echo "Korean-capable system font is available."
          else
            echo "::notice::No known Korean fontconfig family detected; Chromium will use the OS/browser fallback stack and the browser smoke will validate rendered glyphs."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/ui_browser_smoke.mjs
      - run: node scripts/responsive_preview_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-dashboard-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
