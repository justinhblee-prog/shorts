name: Backend tests
on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/nexus-development-job-worker.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/nexus-development-job-worker.yml"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: sh scripts/validate.sh
      - run: python -c "import yaml; yaml.safe_load(open('.github/workflows/nexus-development-job-worker.yml', encoding='utf-8'))"
