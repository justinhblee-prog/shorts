name: NEXUS STUDIO PRO continuous Codex iteration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nexus-studio-pro-codex-iteration
  cancel-in-progress: false

jobs:
  select-base:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      base_branch: ${{ steps.select.outputs.base_branch }}
    steps:
      - name: Select newest open development PR as the next base
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              per_page: 100,
              sort: "created",
              direction: "desc",
            });
            const candidates = response.data
              .filter((pr) => !pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`)
              .sort((a, b) => b.number - a.number);
            const base = candidates[0]?.head.ref ?? context.payload.repository?.default_branch ?? "main";
            core.setOutput("base_branch", base);
            core.info(`Next iteration base: ${base}`);

  develop:
    needs: select-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out latest development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.select-base.outputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Require the Codex API credential
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY in GitHub Actions secrets before enabling autonomous Codex iterations."
            exit 1
          fi

      - name: Run one bounded development iteration
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/codex/NEXUS_CONTINUOUS_AGENT.md
          output-file: /tmp/nexus-codex-summary.md

      - name: Create a Draft PR for verified changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ needs.select-base.outputs.base_branch }}
          branch: automation/nexus-agent-${{ github.run_id }}
          delete-branch: false
          draft: true
          title: "AUTO: NEXUS STUDIO PRO iteration ${{ github.run_number }}"
          commit-message: "chore: autonomous NEXUS STUDIO PRO iteration"
          body: |
            ## Automated development iteration

            - Base branch: ${{ needs.select-base.outputs.base_branch }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - This PR is created as Draft and must never be merged automatically.
            - The Codex task prompt requires a bounded implementation, tests, and documentation updates.
            - Live provider, OAuth, publishing, deployment, and production-runtime validation are not implied by CI.

            Review the changed files and CI evidence before any human decision.
