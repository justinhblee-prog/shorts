name: NEXUS STUDIO PRO local-model iteration

on:
  workflow_dispatch:
  # Scheduled events run only from the default branch. This remains a Draft proposal
  # until the repository owner explicitly chooses an activation path.
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nexus-studio-pro-local-agent
  cancel-in-progress: false

jobs:
  select-base:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      base_branch: ${{ steps.select.outputs.base_branch }}
    steps:
      - name: Select newest open build branch
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.pulls.list({
              owner, repo, state: "open", per_page: 100,
              sort: "created", direction: "desc",
            });
            const candidates = response.data
              .filter((pr) => !pr.merged_at &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.head.ref.startsWith("build/"))
              .sort((a, b) => b.number - a.number);
            const base = candidates[0]?.head.ref ??
              context.payload.repository?.default_branch ?? "main";
            core.setOutput("base_branch", base);

  develop:
    needs: select-base
    # Requires a repository-owned runner with Ollama and the model already installed.
    # No paid model API or OPENAI_API_KEY is used.
    runs-on: [self-hosted, nexus-local-ai]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out latest development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.select-base.outputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local Ollama model is available
        shell: bash
        run: |
          ollama list
          ollama list | grep -q 'qwen2.5-coder:7b' || {
            echo "::error::Install qwen2.5-coder:7b in local Ollama before running this workflow."
            exit 1
          }

      - name: Install local coding agent
        shell: bash
        run: |
          python -m pip install --user aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run one bounded local-model development iteration
        shell: bash
        env:
          OLLAMA_API_BASE: http://127.0.0.1:11434
        run: |
          aider             --model ollama_chat/qwen2.5-coder:7b             --yes-always             --no-auto-commits             --message-file .github/codex/NEXUS_CONTINUOUS_AGENT.md

      - name: Create a Draft PR for verified changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ needs.select-base.outputs.base_branch }}
          branch: automation/nexus-agent-${{ github.run_id }}
          delete-branch: false
          draft: true
          title: "AUTO: NEXUS STUDIO PRO local iteration ${{ github.run_number }}"
          commit-message: "chore: local-model NEXUS STUDIO PRO iteration"
          body: |
            ## Automated local-model development iteration
            - Base: ${{ needs.select-base.outputs.base_branch }}
            - Model: Ollama qwen2.5-coder:7b running on a repository-owned self-hosted runner.
            - No paid AI API or OPENAI_API_KEY is used.
            - Tests and documentation are required by the agent instructions.
            - This PR is Draft and must never be merged automatically.
            - Live provider, OAuth, publishing, deployment, and production validation are not implied.
