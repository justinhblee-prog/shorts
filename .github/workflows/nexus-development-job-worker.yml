name: NEXUS development job worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

concurrency:
  group: nexus-development-job-worker
  cancel-in-progress: false

jobs:
  development-cycle:
    # Requires the repository-owned Windows runner with Ollama and
    # qwen2.5-coder:7b installed. Scheduled workflows run from the default branch.
    runs-on: [self-hosted, windows, nexus-local-ai]
    timeout-minutes: 100
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure persistent development-job state
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stateRoot = $env:LOCALAPPDATA
          if (-not $stateRoot) {
            if (-not $env:USERPROFILE) {
              throw "Windows runner has neither LOCALAPPDATA nor USERPROFILE; refusing an ephemeral database path."
            }
            $stateRoot = Join-Path $env:USERPROFILE "AppData\Local"
          }
          $stateRoot = Join-Path $stateRoot "NexusStudioPro\shorts"
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $artifactRoot = Join-Path $stateRoot "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $database = Join-Path $stateRoot "development.sqlite3"
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          $databaseFull = [System.IO.Path]::GetFullPath($database)
          if ($databaseFull.StartsWith($workspace, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Development job state must be outside GITHUB_WORKSPACE because checkout cleanup removes workspace files."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "NEXUS_DEVELOPMENT_DB=$databaseFull" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "NEXUS_DEVELOPMENT_ARTIFACT_DIR=$artifactRoot" -Encoding utf8
          Write-Host "Persistent development-job database: $databaseFull"
          Write-Host "Persistent development-job artifact directory: $artifactRoot"

      - name: Verify Python, Ollama and local model
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python is required on the self-hosted runner." }
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) {
            throw "Ollama is not installed or not on PATH."
          }
          $models = ollama list
          if ($LASTEXITCODE -ne 0) { throw "ollama list failed." }
          $models | Out-Host
          if (-not ($models | Select-String -SimpleMatch "qwen2.5-coder:7b")) {
            throw "qwen2.5-coder:7b is not installed on the local runner."
          }
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          if (-not $health.models) { throw "Ollama API returned no installed models." }

      - name: Install backend runtime dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Backend dependency installation failed." }

      - name: Install and verify local Aider CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --user aider-chat
          if ($LASTEXITCODE -ne 0) { throw "Aider installation failed." }
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts', 'nt_user'))"
          if (-not (Test-Path (Join-Path $userScripts "aider.exe"))) {
            throw "Aider executable was not installed in the user scripts directory."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $userScripts
          $env:PATH = "$userScripts;$env:PATH"
          aider --version
          if ($LASTEXITCODE -ne 0) { throw "Aider CLI verification failed." }

      - name: Execute one dependency-aware development cycle
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.NEXUS_GITHUB_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_NAME: ${{ runner.name }}
          OLLAMA_API_BASE: http://127.0.0.1:11434
          NEXUS_DEV_AGENT_MODEL: ollama_chat/qwen2.5-coder:7b
          NEXUS_APPROVED_SCOPES: ${{ secrets.NEXUS_APPROVED_SCOPES }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:GITHUB_TOKEN) {
            throw "Configure NEXUS_GITHUB_READ_TOKEN as a fine-grained read-only GitHub token."
          }
          if (-not $env:NEXUS_APPROVED_SCOPES) {
            $env:NEXUS_APPROVED_SCOPES = "{}"
          }
          python backend/run_development_agent.py
          if ($LASTEXITCODE -ne 0) { throw "Development agent cycle failed." }

      - name: Create Draft PR for verified changes only
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/nexus-development-cycle
          delete-branch: false
          draft: true
          title: "AUTO: NEXUS development cycle ${{ github.run_number }}"
          body: |
            ## Automated local-model development cycle
            - Worker: dependency-aware SQLite development-job scheduler
            - Model: repository-owned Ollama runner (qwen2.5-coder:7b)
            - Changes are produced only within an explicitly approved file scope.
            - Repository validation moves a job to review_pending; completion is recorded only after the exact Draft PR head and changed files are verified and persisted.
            - If publication fails, validated source snapshots remain in the runner's persistent artifact directory for a later retry.
            - This PR is Draft. No automatic merge or deployment is permitted.
            - External provider integrations and production behavior are not implied.

      - name: Record verified Draft PR publication
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = $env:GITHUB_REPOSITORY
          $parts = $repository.Split("/")
          if ($parts.Length -ne 2) { throw "GITHUB_REPOSITORY must be owner/repo." }
          $owner = $parts[0]
          $branch = "automation/nexus-development-cycle"
          $api = $env:GITHUB_API_URL.TrimEnd("/")
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $headFilter = [uri]::EscapeDataString($owner + ":" + $branch)
          $baseFilter = [uri]::EscapeDataString($env:GITHUB_DEFAULT_BRANCH)
          $pulls = @(Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/repos/$repository/pulls?state=open&head=$headFilter&base=$baseFilter&per_page=100")
          if ($pulls.Count -eq 0) {
            python backend/finalize_development_publication.py --no-publication
            if ($LASTEXITCODE -ne 0) { throw "Validated work is still pending because no Draft PR exists." }
            Write-Host "No pending review artifacts require publication."
            exit 0
          }
          if ($pulls.Count -ne 1) { throw "Expected exactly one open automation Draft PR for the configured branch." }
          $pr = $pulls[0]
          if ($pr.state -ne "open" -or -not $pr.draft -or $pr.merged_at) {
            throw "Automation PR must remain open, Draft and unmerged."
          }
          if ($pr.head.ref -ne $branch -or $pr.base.ref -ne $env:GITHUB_DEFAULT_BRANCH) {
            throw "Automation PR head/base branch does not match the configured publication target."
          }
          $ref = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/repos/$repository/git/ref/heads/$branch"
          $branchSha = ([string]$ref.object.sha).ToLowerInvariant()
          $headSha = ([string]$pr.head.sha).ToLowerInvariant()
          if (-not $branchSha -or $headSha -ne $branchSha) {
            throw "Draft PR head SHA does not match the current automation branch ref."
          }
          $publishedFiles = @()
          $page = 1
          do {
            $pageFiles = @(Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/repos/$repository/pulls/$($pr.number)/files?per_page=100&page=$page")
            $publishedFiles += @($pageFiles | ForEach-Object { $_.filename })
            $page += 1
          } while ($pageFiles.Count -eq 100)
          if ($publishedFiles.Count -eq 0) { throw "Draft PR contains no changed files for pending review evidence." }
          $env:NEXUS_PUBLICATION_PR_URL = $pr.html_url
          $env:NEXUS_PUBLICATION_HEAD_SHA = $headSha
          $env:NEXUS_PUBLICATION_BRANCH_SHA = $branchSha
          $env:NEXUS_PUBLICATION_FILES_JSON = ConvertTo-Json -InputObject @($publishedFiles) -Compress
          python backend/finalize_development_publication.py
          if ($LASTEXITCODE -ne 0) { throw "Draft PR publication evidence could not be committed to the development-job ledger." }
