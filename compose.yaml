services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8502"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_MEDIA_DIR: /app/data/media
      NEXUS_MEDIA_SCAN_ENABLED: ${NEXUS_MEDIA_SCAN_ENABLED:-false}
      NEXUS_PRIVATE_MEDIA_ROOT: /app/data/media/private-assets
      NEXUS_RENDER_STAGING_ROOT: /app/data/media/render-staging
      NEXUS_RENDER_ARTIFACT_ROOT: /app/data/media/render-artifacts
      NEXUS_FFPROBE_PATH: /usr/bin/ffprobe
      NEXUS_TITLE_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      NEXUS_MAX_ASSET_BYTES: ${NEXUS_MAX_ASSET_BYTES:-500000000}
      NEXUS_MAX_MEDIA_BYTES: ${NEXUS_MAX_ASSET_BYTES:-500000000}
      NEXUS_MAX_RENDER_BYTES: ${NEXUS_MAX_RENDER_BYTES:-2000000000}
    ports:
      - "8502:8502"
    volumes:
      - nexus_data:/app/data
      - clamav_db:${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}:ro
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/api/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped


  clamav-updater:
    profiles: ["media-scan"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", 'freshclam --daemon --foreground --datadir "${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}"']
    env_file: .env
    volumes:
      - clamav_db:${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","worker.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","container_health.py","process","worker.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Allow SIGTERM handler to persist the production pause before Docker SIGKILL.
    stop_grace_period: 45s
    restart: unless-stopped

  timeline-render-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","timeline_render_worker_service.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_PRIVATE_MEDIA_ROOT: /app/data/media/private-assets
      NEXUS_RENDER_STAGING_ROOT: /app/data/media/render-staging
      NEXUS_RENDER_ARTIFACT_ROOT: /app/data/media/render-artifacts
      NEXUS_FFMPEG_PATH: /usr/bin/ffmpeg
      NEXUS_FFPROBE_PATH: /usr/bin/ffprobe
      NEXUS_RENDER_LEASE_SECONDS: ${NEXUS_RENDER_LEASE_SECONDS:-300}
      NEXUS_RENDER_HEARTBEAT_SECONDS: ${NEXUS_RENDER_HEARTBEAT_SECONDS:-10}
      NEXUS_RENDER_IDLE_SECONDS: ${NEXUS_RENDER_IDLE_SECONDS:-3}
      NEXUS_RENDER_WIDTH: ${NEXUS_RENDER_WIDTH:-1080}
      NEXUS_RENDER_HEIGHT: ${NEXUS_RENDER_HEIGHT:-1920}
      NEXUS_RENDER_FPS: ${NEXUS_RENDER_FPS:-30}
      NEXUS_RENDER_MAX_INPUT_BYTES: ${NEXUS_RENDER_MAX_INPUT_BYTES:-2147483648}
      NEXUS_RENDER_MAX_OUTPUT_BYTES: ${NEXUS_RENDER_MAX_OUTPUT_BYTES:-2147483648}
      NEXUS_RENDER_TIMEOUT_SECONDS: ${NEXUS_RENDER_TIMEOUT_SECONDS:-900}
      NEXUS_RENDER_WORKER_ID: ${NEXUS_RENDER_WORKER_ID:-nexus-render-worker-1}
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","container_health.py","process","timeline_render_worker_service.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 90s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","scheduler.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","container_health.py","process","scheduler.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  metrics-collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","metrics_collector.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_METRICS_COLLECTION_INTERVAL_SECONDS: ${NEXUS_METRICS_COLLECTION_INTERVAL_SECONDS:-21600}
      NEXUS_METRICS_MIN_AGE_SECONDS: ${NEXUS_METRICS_MIN_AGE_SECONDS:-21600}
      NEXUS_METRICS_BATCH_SIZE: ${NEXUS_METRICS_BATCH_SIZE:-50}
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","container_health.py","process","metrics_collector.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - |
        while true; do
          if python backup_restore.py backup --db /app/data/nexus.sqlite3 --media-dir /app/data/media --output /backups --retain-days "$NEXUS_BACKUP_RETENTION_DAYS"; then
            date +%s > /backups/.last-success.tmp && mv /backups/.last-success.tmp /backups/.last-success;
          else
            echo "nexus_backup_failed";
          fi;
          sleep "$NEXUS_BACKUP_INTERVAL_SECONDS";
        done
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_MEDIA_DIR: /app/data/media
      NEXUS_BACKUP_DIR: /backups
      NEXUS_BACKUP_RETENTION_DAYS: ${NEXUS_BACKUP_RETENTION_DAYS:-14}
      NEXUS_BACKUP_INTERVAL_SECONDS: ${NEXUS_BACKUP_INTERVAL_SECONDS:-86400}
      NEXUS_BACKUP_HEALTH_MAX_AGE_SECONDS: ${NEXUS_BACKUP_HEALTH_MAX_AGE_SECONDS:-172800}
    volumes:
      - nexus_data:/app/data
      - nexus_backups:/backups
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","container_health.py","backup","/backups/.last-success"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 600s
    restart: unless-stopped

volumes:
  nexus_data:
  nexus_backups:
  clamav_db:
