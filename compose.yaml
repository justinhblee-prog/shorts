services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8502"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_MEDIA_DIR: /app/data/media
    ports:
      - "8502:8502"
    volumes:
      - nexus_data:/app/data
      - clamav_db:${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}:ro
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped


  clamav-updater:
    profiles: ["media-scan"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", 'freshclam --daemon --foreground --datadir "${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}"']
    env_file: .env
    volumes:
      - clamav_db:${NEXUS_CLAMAV_DATABASE_DIR:-/var/lib/clamav}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","worker.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    # Allow SIGTERM handler to persist the production pause before Docker SIGKILL.
    stop_grace_period: 45s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","scheduler.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  metrics-collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","metrics_collector.py"]
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_METRICS_COLLECTION_INTERVAL_SECONDS: ${NEXUS_METRICS_COLLECTION_INTERVAL_SECONDS:-21600}
      NEXUS_METRICS_MIN_AGE_SECONDS: ${NEXUS_METRICS_MIN_AGE_SECONDS:-21600}
      NEXUS_METRICS_BATCH_SIZE: ${NEXUS_METRICS_BATCH_SIZE:-50}
    volumes:
      - nexus_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - |
        while true; do
          python backup_restore.py backup --db /app/data/nexus.sqlite3 --media-dir /app/data/media --output /backups --retain-days "$NEXUS_BACKUP_RETENTION_DAYS" || echo "nexus_backup_failed";
          sleep "$NEXUS_BACKUP_INTERVAL_SECONDS";
        done
    env_file: .env
    environment:
      NEXUS_DB_PATH: /app/data/nexus.sqlite3
      NEXUS_MEDIA_DIR: /app/data/media
      NEXUS_BACKUP_DIR: /backups
      NEXUS_BACKUP_RETENTION_DAYS: ${NEXUS_BACKUP_RETENTION_DAYS:-14}
      NEXUS_BACKUP_INTERVAL_SECONDS: ${NEXUS_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - nexus_data:/app/data
      - nexus_backups:/backups
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus_data:
  nexus_backups:
  clamav_db:
